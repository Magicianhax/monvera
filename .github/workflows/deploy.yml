# Deploy the web app to Cloudflare on every push to main-public.
#
# This exists because local deploys proved unreproducible: builds silently
# depended on one machine's drifted node_modules, its Node version, and
# Windows symlink behavior — and a bad local build once shipped a full outage.
# CI builds from the clean checkout on Linux, so what deploys is exactly what
# is pushed, every time. If npm ci or tsc fails here, the repo is broken for
# everyone, not just this runner — fix the repo, never the runner.
#
# Secrets required (repo Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   Workers deploy token (Edit Workers template + D1/KV/Images edit)
#   NEXT_PUBLIC_RPC_URL    keyed RPC endpoint, inlined into the client bundle at build
name: deploy-web
on:
  push:
    branches: [main-public]
    paths: ["web/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:
concurrency:
  group: deploy-web
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Typecheck (the repo gate)
        run: npx tsc --noEmit
      - name: Build and deploy
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 5642fb8f14fd0f264fe5bf5dbf988aa9
          NEXT_PUBLIC_RPC_URL: ${{ secrets.NEXT_PUBLIC_RPC_URL }}
      - name: Verify production
        run: |
          sleep 10
          for u in / /stake /groves; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "https://monvera.best$u")
            echo "$u -> $code"
            if [ "$code" -ge 500 ]; then echo "PROD BROKEN after deploy"; exit 1; fi
          done
